<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniArena Extension</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #12121e;
      color: #e4e4f0;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      background: #1a1a2b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
    }
    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 6px;
    }
    .supported-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8888a0;
      margin: 0 0 8px 0;
    }
    .platforms {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .platform-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #1a1a2b;
      border-radius: 6px;
      font-size: 13px;
    }
    .badge {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #34d399;
      flex-shrink: 0;
    }
    a {
      color: #7c3aed;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🤖 OmniArena</h1>
  <div class="status">
    <span class="dot"></span> Extension active — bridge ready
  </div>
  <p class="supported-title">Supported Platforms</p>
  <div class="platforms">
    <div class="platform-row"><span class="badge"></span>ChatGPT</div>
    <div class="platform-row"><span class="badge"></span>Gemini</div>
    <div class="platform-row"><span class="badge"></span>Claude</div>
    <div class="platform-row"><span class="badge"></span>Grok</div>
    <div class="platform-row"><span class="badge"></span>DeepSeek</div>
  </div>
  <p><a href="http://localhost:3000/">Open OmniArena →</a></p>
</body>
</html>
