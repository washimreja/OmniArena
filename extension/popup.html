<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniArena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #1f1f2e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .subtitle { font-size: 11px; color: #888; margin-top: 1px; }
    .status {
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .platforms {
      padding: 0 16px 16px;
    }
    .platforms-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #555; margin-bottom: 8px; padding-top: 4px;
    }
    .platform {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 12px; color: #aaa;
      border-bottom: 1px solid #1a1a28;
    }
    .platform:last-child { border-bottom: none; }
    .platform-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .open-btn {
      display: block; width: calc(100% - 32px); margin: 0 16px 16px;
      padding: 8px; text-align: center;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #fff; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">OmniArena</div>
      <div class="subtitle">One Prompt. Your AIs. One Arena.</div>
    </div>
  </div>
  <div class="status">
    <div class="dot"></div>
    Extension active — bridge ready
  </div>
  <div class="platforms">
    <div class="platforms-title">Supported Platforms</div>
    <div class="platform"><div class="platform-dot" style="background:#10a37f"></div>ChatGPT</div>
    <div class="platform"><div class="platform-dot" style="background:#4285f4"></div>Gemini</div>
    <div class="platform"><div class="platform-dot" style="background:#cc785c"></div>Claude</div>
    <div class="platform"><div class="platform-dot" style="background:#1da1f2"></div>Grok</div>
    <div class="platform"><div class="platform-dot" style="background:#5b8dee"></div>DeepSeek</div>
  </div>
  <a href="http://localhost:3000" target="_blank" class="open-btn">Open OmniArena →</a>
</body>
</html>
